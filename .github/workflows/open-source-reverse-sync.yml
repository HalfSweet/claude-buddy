name: Open Source Reverse Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      public_head:
        description: Public commit to sync. Defaults to the workflow commit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: open-source-reverse-sync-main
  cancel-in-progress: false

env:
  PUBLIC_REPOSITORY: HalfSweet/claude-buddy
  PUBLIC_BRANCH: main
  ORIGIN_REPOSITORY: HalfSweet/claude-desktop-buddy-sifli
  ORIGIN_BRANCH: main
  SYNC_STATE_REF: refs/heads/sync/open-source-main

jobs:
  sync:
    if: github.repository == 'HalfSweet/claude-buddy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure origin deploy key
        shell: bash
        env:
          ORIGIN_SYNC_DEPLOY_KEY: ${{ secrets.ORIGIN_SYNC_DEPLOY_KEY }}
        run: |
          : "${ORIGIN_SYNC_DEPLOY_KEY:?set ORIGIN_SYNC_DEPLOY_KEY to the origin repository write deploy key}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORIGIN_SYNC_DEPLOY_KEY" > ~/.ssh/origin_sync_deploy_key
          chmod 600 ~/.ssh/origin_sync_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/origin_sync_deploy_key"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Replay public commits into origin
        shell: bash
        env:
          ORIGIN_REPO_URL: git@github.com:HalfSweet/claude-desktop-buddy-sifli.git
          PUBLIC_HEAD: ${{ github.event.inputs.public_head || github.sha }}
        run: |
          chmod +x .github/scripts/open-source-reverse-sync.sh
          .github/scripts/open-source-reverse-sync.sh sync

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Open source reverse sync"
            echo "- Source: \`${PUBLIC_REPOSITORY}@${PUBLIC_BRANCH}\`"
            echo "- Target: \`${ORIGIN_REPOSITORY}@${ORIGIN_BRANCH}\`"
            echo "- Strategy: filter private/sync paths, replay public commits on origin main, then advance \`${SYNC_STATE_REF}\`."
            echo "- Checks before push: none; public PR review and CI are the gate."
          } >> "$GITHUB_STEP_SUMMARY"
